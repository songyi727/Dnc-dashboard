<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>계약 현황</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#F7F7F5;
    --surface:#FFFFFF;
    --border:#E4E2DC;
    --border-strong:#CFCCC3;
    --text:#1F1E1B;
    --text-sub:#6B6A63;
    --text-mute:#9B9A92;
    --accent:#185FA5;
    --accent-bg:#E6F1FB;
    --green:#0F6E56;
    --green-bg:#E1F5EE;
    --amber:#854F0B;
    --amber-bg:#FAEEDA;
    --red:#A32D2D;
    --red-bg:#FCEBEB;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:"Pretendard","Noto Sans KR",-apple-system,BlinkMacSystemFont,"Malgun Gothic",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1280px;margin:0 auto;padding:28px 32px 60px;}

  header.page{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px;}
  header.page h1{font-size:20px;font-weight:600;margin:0 0 6px;}
  header.page p{font-size:13px;color:var(--text-sub);margin:0;}
  .nav-pills{display:flex;gap:6px;}
  .nav-pills a{font-size:13px;padding:7px 14px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text-sub);text-decoration:none;}
  .nav-pills a.active{background:var(--text);color:#fff;border-color:var(--text);}

  .toolbar{display:flex;align-items:center;gap:10px;margin-bottom:20px;flex-wrap:wrap;}
  .filter-group{display:flex;flex-direction:column;gap:4px;}
  .filter-group label{font-size:11.5px;color:var(--text-mute);}
  select{
    font-size:13px;padding:8px 12px;border-radius:8px;
    border:1px solid var(--border-strong);background:var(--surface);color:var(--text);min-width:150px;
  }
  .toolbar .period{font-size:12.5px;color:var(--text-sub);margin-left:auto;align-self:flex-end;padding-bottom:8px;}

  .section-title{font-size:14px;font-weight:600;margin:0 0 10px;display:flex;justify-content:space-between;align-items:baseline;}
  .section-title .count{font-size:12px;color:var(--text-mute);font-weight:400;}

  .table-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;}
  .table-scroll{overflow-x:auto;}
  table{border-collapse:collapse;width:100%;font-size:12.5px;}
  th{text-align:center;padding:8px 10px;color:var(--text-sub);font-weight:600;background:#FAFAF8;border-bottom:1px solid var(--border);white-space:nowrap;}
  th:nth-child(1),th:nth-child(2),th:nth-child(3),th:nth-child(4),th:nth-child(5){text-align:left;}
  td{padding:7px 10px;text-align:center;border-bottom:1px solid var(--border);white-space:nowrap;}
  td:nth-child(1),td:nth-child(2),td:nth-child(3),td:nth-child(4),td:nth-child(5){text-align:left;}
  .check{display:inline-flex;flex-direction:column;align-items:center;gap:1px;}
  .check .mark{color:var(--green);font-weight:700;font-size:13px;}
  .check .date{font-size:10px;color:var(--text-mute);}
  .dash{color:var(--border-strong);}
  .empty{color:var(--text-mute);}
</style>
</head>
<body>
<script src="block_data.js"></script>
<script src="block_common.js"></script>
<div class="wrap">

  <header class="page">
    <div>
      <h1>계약 현황</h1>
      <p>블록처가 어떤 품목을 계약했는지 한눈에 확인하세요</p>
    </div>
    <div class="nav-pills">
      <a href="#" class="active">계약 현황</a>
      <a href="block_index.html">현황 요약</a>
      <a href="block_reps.html">담당자별 현황</a>
      <a href="block_manage.html">관리장</a>
      <a href="block_clients.html">거래처 현황</a>
      <a href="#" id="btn-export" style="cursor:pointer">엑셀 다운로드</a>
    </div>
  </header>

  <div class="toolbar">
    <div class="filter-group">
      <label>계약연도</label>
      <select id="f-year"></select>
    </div>
    <div class="filter-group">
      <label>블록담당자</label>
      <select id="f-manager"></select>
    </div>
    <div class="filter-group">
      <label>블록영업담당자</label>
      <select id="f-blockrep"></select>
    </div>
    <div class="filter-group">
      <label>팀</label>
      <select id="f-team"></select>
    </div>
    <div class="filter-group">
      <label>영업담당자</label>
      <select id="f-rep"></select>
    </div>
    <span class="period" id="periodLabel"></span>
  </div>

  <div class="section-title">
    블록처별 계약 현황
    <span class="count" id="listMeta"></span>
  </div>
  <div class="table-card">
    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th>블록담당자</th><th>블록영업담당자</th><th>팀</th><th>영업담당자</th><th>블록처</th>
            <th>나보타</th><th>브이올렛</th><th>필러군</th><th>리프팅실</th><th>리알로파인</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>

</div>

<script>
const hasData = typeof window.BLOCK_DETAIL !== 'undefined' && typeof window.BLOCK_META !== 'undefined';
const GROUPS = ['나보타','브이올렛','필러군','리프팅실','리알로'];
const GROUP_LABEL = { '나보타':'나보타','브이올렛':'브이올렛','필러군':'필러군','리프팅실':'리프팅실','리알로':'리알로파인' };

if(!hasData){
  document.querySelector('.wrap').innerHTML = `
    <div style="padding:60px 20px;text-align:center;color:var(--text-mute);font-size:14px;">
      block_data.js를 찾을 수 없습니다.<br>
      <span style="font-size:12.5px;">generate_block_dashboard.py를 실행해서 block_data.js를 같은 폴더에 생성한 뒤 다시 열어주세요.</span>
    </div>`;
}

function fillSelect(id, values){
  const sel = document.getElementById(id);
  sel.innerHTML = '<option value="all">전체</option>' + values.map(v=>`<option value="${v}">${v}</option>`).join('');
}

function blockRepOf(managerBiz){
  const info = window.COMPANY_INFO ? window.COMPANY_INFO[managerBiz] : null;
  return info ? (info.block_rep || '-') : '-';
}

if(hasData){
  fillSelect('f-year', [...new Set(window.BLOCK_DETAIL.flatMap(r=>r.client_contract_years||[]))].sort());
  fillSelect('f-manager', [...new Set(window.BLOCK_DETAIL.map(r=>r.manager))].filter(v=>v).sort((a,b)=>a.localeCompare(b,'ko')));
  fillSelect('f-blockrep', [...new Set(Object.values(window.COMPANY_INFO||{}).map(v=>v.block_rep))].filter(v=>v && v!=='-').sort((a,b)=>a.localeCompare(b,'ko')));
  fillSelect('f-team', [...new Set(window.BLOCK_DETAIL.map(r=>r.team))].filter(v=>v && v!=='-').sort((a,b)=>a.localeCompare(b,'ko')));
  fillSelect('f-rep', [...new Set(window.BLOCK_DETAIL.map(r=>r.rep))].filter(v=>v && v!=='-').sort((a,b)=>a.localeCompare(b,'ko')));
}

const fYear = document.getElementById('f-year');
const fManager = document.getElementById('f-manager');
const fBlockRep = document.getElementById('f-blockrep');
const fTeam = document.getElementById('f-team');
const fRep = document.getElementById('f-rep');
const tbody = document.getElementById('tbody');

if(hasData){
  const years = [...new Set(window.BLOCK_DETAIL.flatMap(r=>r.client_contract_years||[]))].sort();
  fYear.value = years[years.length-1] || 'all';
}

function currentFilters(){
  return {
    year: fYear.value,
    manager: fManager.value,
    blockRep: fBlockRep.value,
    team: fTeam.value,
    rep: fRep.value,
  };
}

function buildRows(f){
  return window.BLOCK_DETAIL.filter(rec => {
    if(f.year !== 'all' && !(rec.client_contract_years||[]).some(y=>String(y)===String(f.year))) return false;
    if(f.manager !== 'all' && rec.manager !== f.manager) return false;
    if(f.team !== 'all' && rec.team !== f.team) return false;
    if(f.rep !== 'all' && rec.rep !== f.rep) return false;
    if(f.blockRep !== 'all' && blockRepOf(rec.manager_biz) !== f.blockRep) return false;
    return true;
  }).map(rec => {
    const contracts = {};
    GROUPS.forEach(g=>{
      const byYear = (rec.groups[g]||{}).by_year || {};
      let snap = null;
      if(f.year === 'all'){
        const latest = Object.keys(byYear).sort().pop();
        snap = latest ? byYear[latest] : null;
      } else {
        snap = byYear[String(f.year)] || null;
      }
      contracts[g] = snap ? { contracted: true, date: snap.contract_date } : { contracted: false };
    });
    return {
      manager: rec.manager,
      blockRep: blockRepOf(rec.manager_biz),
      team: rec.team || '-',
      rep: rec.rep || '-',
      name: rec.name,
      contracts,
    };
  });
}

function render(){
  const f = currentFilters();
  const rows = buildRows(f);

  const labelParts = [];
  if(f.manager !== 'all') labelParts.push(f.manager);
  if(f.year !== 'all') labelParts.push(f.year + '년 계약');
  document.getElementById('periodLabel').textContent = labelParts.length ? labelParts.join(' · ') : '전체';
  document.getElementById('listMeta').textContent = rows.length + '개 처 조회됨';

  rows.sort((a,b) => a.manager.localeCompare(b.manager,'ko') || a.name.localeCompare(b.name,'ko'));

  if(!rows.length){
    tbody.innerHTML = `<tr><td colspan="10" style="text-align:center;color:var(--text-mute);padding:20px;">조건에 맞는 블록처가 없습니다.</td></tr>`;
    return;
  }

  tbody.innerHTML = rows.map(r => {
    const cells = GROUPS.map(g => {
      const c = r.contracts[g];
      if(c.contracted){
        return `<td><span class="check"><span class="mark">✓</span><span class="date">${(c.date||'').replace(/-/g,'.')}</span></span></td>`;
      }
      return `<td><span class="dash">-</span></td>`;
    }).join('');
    return `<tr>
      <td>${r.manager}</td><td>${r.blockRep}</td><td>${r.team}</td><td>${r.rep}</td><td>${r.name}</td>
      ${cells}
    </tr>`;
  }).join('');
}

if(hasData){
  [fYear, fManager, fBlockRep, fTeam, fRep].forEach(s => s.addEventListener('change', render));
  render();

  document.getElementById('btn-export').addEventListener('click', function(e){
    e.preventDefault();
    const pw = prompt('다운로드 비밀번호를 입력하세요');
    if(pw === null) return;
    if(pw !== 'dncsales'){ alert('비밀번호가 올바르지 않습니다.'); return; }

    const f = currentFilters();
    const rows = buildRows(f).sort((a,b) => a.manager.localeCompare(b.manager,'ko') || a.name.localeCompare(b.name,'ko'));

    const data = rows.map(r => {
      const row = {
        '블록담당자': r.manager,
        '블록영업담당자': r.blockRep,
        '팀': r.team,
        '영업담당자': r.rep,
        '블록처': r.name,
      };
      GROUPS.forEach(g => {
        const c = r.contracts[g];
        row[GROUP_LABEL[g]] = c.contracted ? (c.date || '계약됨') : '';
      });
      return row;
    });

    const ws = XLSX.utils.json_to_sheet(data);
    const totalCols = 5 + GROUPS.length;
    const colWidths = [];
    for(let c=0; c<totalCols; c++){
      let maxLen = 8;
      const header = Object.keys(data[0] || {})[c];
      if(header) maxLen = Math.max(maxLen, header.length * 1.8);
      data.forEach(row => {
        const v = Object.values(row)[c];
        if(v) maxLen = Math.max(maxLen, String(v).length * 1.6);
      });
      colWidths.push({ wch: Math.min(Math.ceil(maxLen), 24) });
    }
    ws['!cols'] = colWidths;
    ws['!autofilter'] = { ref: XLSX.utils.encode_range({ s:{r:0,c:0}, e:{r:data.length, c:totalCols-1} }) };

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, '계약현황');
    XLSX.writeFile(wb, `블록계약현황.xlsx`);
  });
}
</script>
</body>
</html>
